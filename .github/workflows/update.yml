# Refresh videos.json from the channels' YouTube feeds. When the list changes,
# the commit makes GitHub Pages republish the site.
name: Update videos

on:
  schedule:
    - cron: '17 11 * * *'  # once a day at 11:17 UTC (6:17 am EST, 7:17 am EDT)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [channels.json, scripts/update.mjs]

permissions:
  contents: write

concurrency:
  group: update-videos

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node scripts/update.mjs
      - name: Commit videos.json if it changed
        run: |
          git add videos.json
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update videos"
          git pull --rebase
          git push
